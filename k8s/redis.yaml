apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rag-yeni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:7.2.0-v14
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-yeni
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
