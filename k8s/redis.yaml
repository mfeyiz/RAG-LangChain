# WARNING: this is 3 independent, non-clustered redis-stack-server instances,
# each with its own PVC and no replication between them. The "redis" Service
# below round-robins connections across all 3 pods, so a session's checkpoint
# (RAG/services/session_store.py, the /ask graph's AsyncRedisSaver) can be
# written to one pod and read back from another, empty one. This setup is for
# replica-count/restart-resilience testing only — it is NOT safe for the app's
# actual session/checkpoint consistency until real Redis Cluster or
# Sentinel-based replication is configured. Scale back to 1 replica (or add
# clustering) before relying on this for anything but a load test.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: rag-yeni
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:7.2.0-v14
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: standard-rwo
---
# Headless service required by the StatefulSet for stable per-pod DNS
# (redis-0.redis-headless, redis-1.redis-headless, ...).
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: rag-yeni
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Load-balancing ClusterIP the app connects to (REDIS_URL=redis://redis:6379) —
# kept so existing app config doesn't need to change, though see the warning
# above about cross-pod consistency.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rag-yeni
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
