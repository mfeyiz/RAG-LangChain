apiVersion: v1
kind: Secret
metadata:
  name: rag-langchain-secrets
  namespace: rag-yeni
type: Opaque
stringData:
  OPENROUTER_API_KEY: replace-with-your-openrouter-api-key
  LANGFUSE_PUBLIC_KEY: replace-with-your-langfuse-public-key
  LANGFUSE_SECRET_KEY: replace-with-your-langfuse-secret-key
  # Postgres + pgvector. POSTGRES_PASSWORD provisions the DB pod; DATABASE_URL is
  # how the backend connects — keep the password in both consistent.
  POSTGRES_PASSWORD: replace-with-a-strong-postgres-password
  DATABASE_URL: postgresql://rag:replace-with-a-strong-postgres-password@postgres:5432/rag
  # Token auth. JWT_SECRET signs the bearer tokens; ADMIN_* seeds the bootstrap
  # admin who can log in and run @update on a fresh deployment.
  JWT_SECRET: replace-with-a-long-random-secret
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: replace-with-a-strong-admin-password
  # Google Cloud project — required (hard os.environ lookup, no default) by
  # embeddings.py, documentai_parser.py, and the Vertex reranker. Without it
  # startup indexing fails silently and the UI is stuck on "Indexing
  # documents, please wait..." forever.
  GOOGLE_CLOUD_PROJECT: replace-with-your-gcp-project-id
  # Discovery Engine (Vertex reranker) needs the numeric project number, not
  # the string ID. Optional — only the reranker degrades without it.
  GOOGLE_CLOUD_PROJECT_NUMBER: replace-with-your-gcp-project-number
  # Document AI processor used when DOC_PARSER=documentai.
  DOCAI_PROCESSOR_ID: replace-with-your-docai-processor-id
