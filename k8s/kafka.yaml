# 2-broker KRaft cluster. Both pods share one StatefulSet pod template, so
# KAFKA_NODE_ID and KAFKA_ADVERTISED_LISTENERS (which MUST differ per pod)
# can't be plain static env vars like the old single-node config used — the
# command below derives them from the pod's ordinal (parsed out of its own
# hostname, e.g. "kafka-1" -> 1) before handing off to the official image's
# entrypoint.
#
# DEPLOY STEP THIS CANNOT DO FOR YOU — REQUIRED ONE-TIME MANUAL ACTION:
#   The existing kafka-0 already has a KRaft metadata log formatted for a
#   quorum that includes a voter (kafka-2) this manifest no longer defines.
#   KRaft does not support shrinking an already-formatted quorum by just
#   changing KAFKA_CONTROLLER_QUORUM_VOTERS and re-applying — kafka-0 would
#   keep waiting on the now-nonexistent kafka-2 voter. Before applying this
#   manifest, delete the existing brokers' data so both bootstrap the
#   2-voter quorum together from scratch:
#     kubectl delete statefulset kafka -n rag-yeni --cascade=orphan
#     kubectl delete pvc kafka-data-kafka-0 kafka-data-kafka-1 -n rag-yeni
#     kubectl apply -k k8s/
#   Only in-flight/unconsumed job-queue messages (pending report-generation
#   jobs — see RAG/services/job_queue.py) are lost; no document/user data
#   lives in Kafka. A brand-new deployment doesn't need this step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: rag-yeni
  labels:
    app: kafka
spec:
  # Headless so each broker gets a stable per-pod DNS name (kafka-N.kafka) —
  # required both for KRaft's controller quorum voter addresses and for each
  # broker to advertise its own reachable address to clients.
  serviceName: kafka
  replicas: 2
  # KRaft's raft quorum needs a majority of voters online to elect a leader
  # (2 of 3 here) before ANY of them can report Ready. The default OrderedReady
  # policy only creates kafka-N+1 once kafka-N is Ready — which kafka-0 alone
  # can never be, since it needs a peer to reach majority. That's a deadlock:
  # kafka-1 never gets created because kafka-0 never becomes Ready. Parallel
  # starts all replicas at once so they can actually vote each other in.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID=$((ordinal + 1))
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.rag-yeni.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Static list of both voters — same value on every pod. Node IDs
            # here (1/2) must line up with KAFKA_NODE_ID = ordinal + 1 above
            # (kafka-0 -> 1, kafka-1 -> 2).
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.rag-yeni.svc.cluster.local:9093,2@kafka-1.kafka.rag-yeni.svc.cluster.local:9093"
            # Replication factor can't exceed the broker count (2 here) — the
            # old value of 3 left __consumer_offsets/transaction-state-log
            # permanently uncreatable, which meant no consumer group could
            # ever get a coordinator (jobs queued in rag.jobs sat unread).
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "2"
            # min.isr = replicas would block all writes the moment either
            # broker restarts (these two have been restart-prone). 1 keeps
            # writes available with only one broker in sync.
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Matches the 2 rag-worker replicas (worker-deployment.yaml) 1:1 —
            # a 3rd consumer in that group would otherwise sit permanently idle.
            - name: KAFKA_NUM_PARTITIONS
              value: "2"
            # Fixed cluster ID, generated once — required for KRaft storage
            # bootstrap (`kafka-storage.sh format`), which the official image's
            # entrypoint runs automatically on first boot using this value.
            # Same value on every pod — it identifies the cluster, not the node.
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: rag-yeni
spec:
  clusterIP: None
  # Headless services only publish per-pod DNS (kafka-N.kafka...) for Ready
  # pods by default. But no broker can become Ready (readinessProbe on 9092)
  # until it can resolve and reach its peers to form the raft quorum — a
  # deadlock discovered live (kafka-0/kafka-1 both crash-looping forever on
  # UnknownHostException for each other). Publish addresses before readiness
  # so peer discovery can actually happen.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
