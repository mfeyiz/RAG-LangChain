# 3-broker KRaft cluster. All 3 pods share one StatefulSet pod template, so
# KAFKA_NODE_ID and KAFKA_ADVERTISED_LISTENERS (which MUST differ per pod)
# can't be plain static env vars like the old single-node config used — the
# command below derives them from the pod's ordinal (parsed out of its own
# hostname, e.g. "kafka-1" -> 1) before handing off to the official image's
# entrypoint.
#
# DEPLOY STEP THIS CANNOT DO FOR YOU — REQUIRED ONE-TIME MANUAL ACTION:
#   The existing kafka-0 already has a KRaft metadata log formatted for a
#   single-voter quorum ("1@kafka-0...:9093" only). KRaft does not support
#   growing an already-formatted single-node quorum into a 3-node one by
#   just changing KAFKA_CONTROLLER_QUORUM_VOTERS and re-applying — kafka-0
#   would keep rejecting kafka-1/kafka-2 as unknown voters. Before applying
#   this manifest, delete the existing broker's data so all 3 bootstrap the
#   3-voter quorum together from scratch:
#     kubectl delete statefulset kafka -n rag-yeni --cascade=orphan
#     kubectl delete pvc kafka-data-kafka-0 -n rag-yeni
#     kubectl apply -k k8s/
#   Only in-flight/unconsumed job-queue messages (pending report-generation
#   jobs — see RAG/services/job_queue.py) are lost; no document/user data
#   lives in Kafka. A brand-new deployment doesn't need this step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: rag-yeni
  labels:
    app: kafka
spec:
  # Headless so each broker gets a stable per-pod DNS name (kafka-N.kafka) —
  # required both for KRaft's controller quorum voter addresses and for each
  # broker to advertise its own reachable address to clients.
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID=$((ordinal + 1))
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.rag-yeni.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Static list of all 3 voters — same value on every pod. Node IDs
            # here (1/2/3) must line up with KAFKA_NODE_ID = ordinal + 1 above
            # (kafka-0 -> 1, kafka-1 -> 2, kafka-2 -> 3).
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.rag-yeni.svc.cluster.local:9093,2@kafka-1.kafka.rag-yeni.svc.cluster.local:9093,3@kafka-2.kafka.rag-yeni.svc.cluster.local:9093"
            # 3 brokers now actually back each other up, so replicate for real
            # instead of the single-node replication-factor-1 placeholders.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            # Matches the 3 rag-worker replicas (worker-deployment.yaml) 1:1 —
            # a 4th consumer in that group would otherwise sit permanently idle.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            # Fixed cluster ID, generated once — required for KRaft storage
            # bootstrap (`kafka-storage.sh format`), which the official image's
            # entrypoint runs automatically on first boot using this value.
            # Same value on every pod — it identifies the cluster, not the node.
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: rag-yeni
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
