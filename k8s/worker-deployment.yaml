apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag-yeni
  labels:
    app: rag-worker
spec:
  # Scaling this to N replicas is safe (Kafka load-balances partitions across
  # consumers in the "rag-workers" group) but CPU/mem-based HPA (like hpa.yaml
  # uses for the API) is a poor fit for a consumer that's mostly idle-polling —
  # consumer-lag-based autoscaling (e.g. via KEDA) is the right mechanism here
  # and is explicit future work, not v1. Fixed at 3 for now (see KAFKA_NUM_PARTITIONS
  # in kafka.yaml — 3 partitions means a 4th consumer in this group would sit idle).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAffinity:
          # Same rationale as deployment.yaml: prefer co-scheduling with the
          # API pods so the shared rag-data-pvc (RWO) stays on one node.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rag-langchain
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rag-worker
          image: europe-west3-docker.pkg.dev/PROJECT_ID/rag-artifact-registery/rag-langchain:latest
          imagePullPolicy: IfNotPresent
          # Same image as the API Deployment — only the entrypoint differs.
          command: ["uv", "run", "--no-sync", "python", "-m", "RAG.worker"]
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: OPENROUTER_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_ENABLED
              value: "1"
            - name: LLM_BASE_URL
              value: "https://opencode.ai/zen/go/v1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/google-credentials.json"
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: GOOGLE_CLOUD_PROJECT
            - name: GOOGLE_CLOUD_PROJECT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: GOOGLE_CLOUD_PROJECT_NUMBER
                  optional: true
            - name: DOC_PARSER
              value: "documentai"
            - name: DOCAI_LOCATION
              value: "eu"
            - name: DOCAI_PROCESSOR_ID
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: DOCAI_PROCESSOR_ID
            - name: RAG_ENABLE_RERANKER
              value: "1"
            - name: LLM_MODEL
              value: "deepseek-v4-flash"
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: TAVILY_API_KEY
                  optional: true
            - name: HF_HOME
              value: /cache/huggingface
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /cache/sentence-transformers
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: JWT_SECRET
            # The worker only consumes Kafka jobs — it never serves auth
            # endpoints, so ADMIN_USERNAME/PASSWORD aren't needed here.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          # No HTTP server in this process — rely on the consumer loop crashing
          # (and k8s restarting the pod) on unrecoverable errors rather than a
          # synthetic health check.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            # The worker writes generated reports (markdown/images/PDF/DOCX)
            # to the same workspace the API serves from.
            - name: rag-data
              mountPath: /app/RAG/data
              subPath: data
            - name: rag-data
              mountPath: /app/RAG/vector_db
              subPath: vector_db
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: rag-data
          persistentVolumeClaim:
            claimName: rag-data-pvc
        - name: google-cloud-key
          secret:
            secretName: rag-langchain-secrets
            items:
              - key: google-credentials.json
                path: google-credentials.json
