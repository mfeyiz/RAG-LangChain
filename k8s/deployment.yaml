apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-langchain
  namespace: rag-yeni
  labels:
    app: rag-langchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-langchain
  template:
    metadata:
      labels:
        app: rag-langchain
    spec:
      containers:
        - name: rag-langchain
          image: europe-west3-docker.pkg.dev/PROJECT_ID/rag-artifact-registery/rag-langchain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: OPENROUTER_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_ENABLED
              value: "1"
            - name: RAG_ENABLE_RERANKER
              value: "1"
            - name: HF_HOME
              value: /cache/huggingface
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /cache/sentence-transformers
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 7Gi
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: qdrant-data
              mountPath: /app/RAG/vector_db/qdrant
            - name: frontend-static
              mountPath: /app/index.html
              subPath: index.html
              readOnly: true
            - name: frontend-static
              mountPath: /app/script.js
              subPath: script.js
              readOnly: true
            - name: frontend-static
              mountPath: /app/style.css
              subPath: style.css
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-pvc
        - name: frontend-static
          configMap:
            name: frontend-static
