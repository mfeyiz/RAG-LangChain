apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-langchain
  namespace: rag-yeni
  labels:
    app: rag-langchain
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rag-langchain
  template:
    metadata:
      labels:
        app: rag-langchain
    spec:
      containers:
        - name: rag-langchain
          image: europe-west3-docker.pkg.dev/PROJECT_ID/rag-artifact-registery/rag-langchain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: OPENROUTER_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_ENABLED
              value: "1"
            - name: RAG_ENABLE_RERANKER
              value: "1"
            - name: HF_HOME
              value: /cache/huggingface
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /cache/sentence-transformers
            - name: REDIS_URL
              value: redis://redis:6379
            - name: QDRANT_URL
              value: http://qdrant:6333
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "1500Mi"
            limits:
              cpu: "1"
              memory: "3Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
