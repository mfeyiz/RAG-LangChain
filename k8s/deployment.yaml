apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-langchain
  namespace: rag-yeni
  labels:
    app: rag-langchain
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rag-langchain
  template:
    metadata:
      labels:
        app: rag-langchain
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAffinity:
          # Prefer the node where model-cache-pvc is already mounted (RWO
          # allows multiple pods per node). "preferred" not "required" so the
          # first pod of a rolling update can still schedule when no peer exists.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rag-langchain
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rag-langchain
          image: europe-west3-docker.pkg.dev/PROJECT_ID/rag-artifact-registery/rag-langchain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: OPENROUTER_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_ENABLED
              value: "1"
            - name: LLM_BASE_URL
              value: "https://opencode.ai/zen/go/v1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/google-credentials.json"
            # Required by RAG/services/embeddings.py, documentai_parser.py, and
            # the Vertex reranker (retrieval.py) — all read this via a hard
            # os.environ[...] lookup with no default. Without it, startup
            # indexing raises KeyError inside the background task, which is
            # swallowed silently: the pod stays "Running/Ready" (/healthz does
            # not check this) but /status never leaves phase="indexing" and the
            # UI is stuck on "Indexing documents, please wait..." forever.
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: GOOGLE_CLOUD_PROJECT
            # Discovery Engine (Vertex reranker) requires the numeric project
            # number, not the string project ID.
            - name: GOOGLE_CLOUD_PROJECT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: GOOGLE_CLOUD_PROJECT_NUMBER
                  optional: true
            # Defaults to "docling" (see converter.py) if unset, which is no
            # longer a dependency (see pyproject.toml) — uploads would silently
            # degrade to text-only conversion (no figures/images).
            - name: DOC_PARSER
              value: "documentai"
            - name: DOCAI_LOCATION
              value: "eu"
            - name: DOCAI_PROCESSOR_ID
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: DOCAI_PROCESSOR_ID
            - name: RAG_ENABLE_RERANKER
              value: "1"
            - name: LLM_MODEL
              value: "deepseek-v4-flash"
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: TAVILY_API_KEY
                  optional: true
            - name: HF_HOME
              value: /cache/huggingface
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /cache/sentence-transformers
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: ADMIN_USERNAME
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-langchain-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "6Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            # User documents (originals + workspace markdown/pdf) and the BM25
            # corpus files must survive restarts, so back them with a PVC.
            - name: rag-data
              mountPath: /app/RAG/data
              subPath: data
            - name: rag-data
              mountPath: /app/RAG/vector_db
              subPath: vector_db
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: rag-data
          persistentVolumeClaim:
            claimName: rag-data-pvc
        - name: google-cloud-key
          secret:
            secretName: rag-langchain-secrets
            items:
              - key: google-credentials.json
                path: google-credentials.json
