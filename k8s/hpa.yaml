apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-langchain
  namespace: rag-yeni
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-langchain
  minReplicas: 3
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
