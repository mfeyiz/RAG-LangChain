substitutions:
  _REGION: europe-west3
  _GKE_CLUSTER: rag-langchain
  _GKE_NAMESPACE: rag-langchain
  _AR_REPOSITORY: debate-platform-repository
  _SERVICE_NAME: rag-langchain

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: ensure-artifact-registry-repository
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe "$_AR_REPOSITORY" \
          --location="$_REGION" \
        || gcloud artifacts repositories create "$_AR_REPOSITORY" \
          --repository-format=docker \
          --location="$_REGION" \
          --description="RAG LangChain images"

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - .

  - id: push-image-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA

  - id: push-image-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest

  - id: deploy-to-gke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials "$_GKE_CLUSTER" \
          --region "$_REGION" \
          --project "$PROJECT_ID"
        sed -i "s#europe-west3-docker.pkg.dev/PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest#europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA#g" k8s/deployment.yaml
        kubectl apply -k k8s
        kubectl rollout status deployment/$_SERVICE_NAME -n "$_GKE_NAMESPACE" --timeout=300s

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA
  - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
