substitutions:
  _REGION: europe-west4
  _GKE_CLUSTER: deployment-1
  _GKE_NAMESPACE: rag-yeni
  _AR_REPOSITORY: rag-artifact-registery
  _SERVICE_NAME: rag-langchain
  _IMAGE: europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

steps:
  # ── 1. Lint + Unit Tests (cached pip layer via volume) ──────────────────
  - id: lint-and-test
    name: python:3.11-slim
    entrypoint: bash
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
      - name: uv-cache
        path: /root/.cache/uv
    args:
      - -c
      - |
        pip install --quiet uv
        uv sync --frozen --group dev
        uv run flake8 RAG tests --max-line-length=120 --extend-ignore=E501,W503
        uv run pytest tests/ -v --tb=short

  # ── 2. Pull cache image (ignore failure on first run) ───────────────────
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull $_IMAGE:latest || true

  # ── 3. Build with layer cache ────────────────────────────────────────────
  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - lint-and-test
      - pull-cache
    args:
      - build
      - --cache-from
      - $_IMAGE:latest
      - -t
      - $_IMAGE:$SHORT_SHA
      - -t
      - $_IMAGE:latest
      - .

  # ── 4. Push both tags in parallel ───────────────────────────────────────
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_IMAGE

  # ── 5. Deploy to GKE ────────────────────────────────────────────────────
  - id: deploy-to-gke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials "$_GKE_CLUSTER" \
          --region "$_REGION" \
          --project "$PROJECT_ID"
        sed -i "s#europe-west3-docker.pkg.dev/PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest#$_IMAGE:$SHORT_SHA#g" k8s/deployment.yaml
        kubectl apply -k k8s
        kubectl rollout status deployment/$_SERVICE_NAME -n "$_GKE_NAMESPACE" --timeout=300s

images:
  - $_IMAGE:$SHORT_SHA
  - $_IMAGE:latest
