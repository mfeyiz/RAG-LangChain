substitutions:
  _REGION: europe-west3
  _GKE_CLUSTER: rag-langchain
  _GKE_NAMESPACE: rag-langchain
  _AR_REPOSITORY: rag-artifact-registery
  _SERVICE_NAME: rag-langchain

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── 1. Lint + Unit Tests ────────────────────────────────────────────────
  - id: lint-and-test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet uv
        uv sync --frozen --group dev
        uv run flake8 RAG tests --max-line-length=120 --extend-ignore=E501,W503
        uv run pytest tests/ -v --tb=short

  # ── 2. Build Docker Image ───────────────────────────────────────────────
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - .

  # ── 3. Security Scan (fail on CRITICAL CVEs) ────────────────────────────
  - id: save-image-tarball
    name: gcr.io/cloud-builders/docker
    args:
      - save
      - -o
      - /workspace/image.tar
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA

  - id: scan-image
    name: aquasec/trivy:latest
    args:
      - image
      - --exit-code=1
      - --severity=CRITICAL
      - --no-progress
      - --ignore-unfixed
      - --input
      - /workspace/image.tar

  # ── 4. Push ─────────────────────────────────────────────────────────────
  - id: push-image-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA

  - id: push-image-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest

  # ── 5. Deploy to GKE ────────────────────────────────────────────────────
  - id: deploy-to-gke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials "$_GKE_CLUSTER" \
          --region "$_REGION" \
          --project "$PROJECT_ID"
        sed -i "s#europe-west3-docker.pkg.dev/PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest#europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA#g" k8s/deployment.yaml
        kubectl apply -k k8s
        kubectl rollout status deployment/$_SERVICE_NAME -n "$_GKE_NAMESPACE" --timeout=300s

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$SHORT_SHA
  - europe-west3-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
