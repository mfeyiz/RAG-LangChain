[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=3.7.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.30.0",
    "google>=3.0.0",
    "google-genai>=1.60.0",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.0",
    "langchain-huggingface>=1.2.0",
    "langchain-nomic>=1.0.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "nomic>=3.9.0",
    "ollama>=0.6.1",
    "openai>=2.16.0",
    "pypdf>=6.6.2",
    # Dense vector store: Postgres + pgvector (replaces Qdrant).
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3.6",
    "python-dotenv>=1.2.1",
    "ragas>=0.3.0",
    "requests>=2.32.5",
    "torch>=2.0.0",
    "sentence-transformers>=5.2.2",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "datasets>=3.0.0",
    "langfuse>=4.7.1",
    "langgraph-checkpoint-redis>=0.4.1",
    "markitdown[docx,pdf]>=0.1.1",
    "markdown>=3.7",
    "pdfminer.six>=20240706",
    "weasyprint>=63.0",
    # Multimodal ingestion: docling extracts figures and preserves heading
    # structure; pillow handles the extracted image files.
    "docling>=2.0.0",
    "pillow>=10.0.0",
    # Google Cloud retrieval stack (provider-agnostic; imported lazily, only when
    # the matching env flag selects them):
    #   DOC_PARSER=documentai       -> google-cloud-documentai (+ pymupdf crop)
    #   EMBEDDING_PROVIDER=google   -> google-genai (already above), Gemini Embedding 2
    #   RERANKER_PROVIDER=vertex    -> google-cloud-discoveryengine (Ranking API)
    "google-cloud-documentai>=2.30.0",
    "google-cloud-discoveryengine>=0.13.0",
    "pymupdf>=1.24.0",
    # Code interpreter node + dynamic chart generation (Feature 4b/4c).
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    # Git-backed workspace version control (Feature 2): @update → commit, restore.
    "GitPython>=3.1.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.2",
]

[tool.uv]
torch-backend = "cpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
